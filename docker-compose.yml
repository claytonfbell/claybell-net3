services:
  claybell-net3:
    image: claybell-net3:latest
    container_name: claybell-net3
    # The image is built on a workstation and shipped with deploy.sh
    # (docker save | ssh docker load) — never pulled from a registry.
    pull_policy: never
    ports:
      # nginx runs on the same host — no need to expose this to the network.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
